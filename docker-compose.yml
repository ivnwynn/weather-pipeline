services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: bd-kafka
    ports:
      - "9092:9092"
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: bd-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
